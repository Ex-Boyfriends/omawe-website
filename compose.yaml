# Deploy target: lives on the VPS as a git checkout of this repo.
# The cd-prod.yml workflow SSHes in, pulls main, then runs:
#   docker compose build web && docker compose up -d web
#
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # loopback only; existing reverse proxy fronts it
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
